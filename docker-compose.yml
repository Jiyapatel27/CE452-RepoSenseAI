# Qdrant vector database for RepoSense AI (Step 5).
#
# Start:    docker compose up -d
# Status:   docker compose ps
# Logs:     docker compose logs -f qdrant
# Stop:     docker compose stop          (keeps your indexed vectors)
# Remove:   docker compose down          (keeps data - it is on disk below)
# Wipe:     docker compose down && rmdir /s .reposense-data\qdrant
#
# Dashboard: http://localhost:6333/dashboard

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: reposense-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API - this is what QDRANT_URL points at
      - "6334:6334"   # gRPC API (unused by us, handy for tooling)
    volumes:
      # Bind-mounted into the project's gitignored data folder, so vectors
      # survive `docker compose down` and you can see how much space they take.
      - ./.reposense-data/qdrant:/qdrant/storage
    environment:
      # Qdrant is unauthenticated by default. Fine for localhost-only use; do
      # not expose port 6333 to a network without setting an API key.
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      # Qdrant's image has no curl/wget, so probe with its own binary.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
